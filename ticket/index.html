<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>わらしべ長者 お買物券｜小判鮫</title><style>
body{margin:0;background:#F4F0E8;color:#120A07;font-family:"Hiragino Sans","Noto Sans JP",sans-serif}
.card{max-width:420px;margin:14px auto;padding:20px 18px;background:#fffdf8;border:2px solid #7C4412;border-radius:14px;text-align:center}
.kicker{letter-spacing:.25em;color:#7C4412;font-size:12px;margin:0}h1{font-family:"Hiragino Mincho ProN","Noto Serif JP",serif;font-size:26px;margin:6px 0 2px}
.name{font-size:18px;margin:8px 0}.left{font-size:64px;font-weight:900;line-height:1;margin:6px 0 0}.unit{font-size:20px}.yen{color:#7C4412;font-weight:bold;margin:4px 0 10px}
.id{font-size:24px;font-weight:bold;letter-spacing:.08em;background:#F4F0E8;border-radius:8px;padding:6px;margin:10px 0}
#qr{display:flex;justify-content:center;margin:10px 0}#qr img{width:190px;height:190px}
.small{font-size:12px;color:#5a4636}.rules{text-align:left;font-size:13px;line-height:1.7;margin:12px 0 0;padding-left:1.2em}
.ng{color:#a12a2a;font-weight:bold;font-size:18px}.hist{text-align:left;font-size:13px;background:#F4F0E8;border-radius:8px;padding:8px 10px;margin:10px 0}
button{padding:12px 16px;font-size:16px;font-weight:bold;border-radius:10px;border:2px solid #7C4412;background:#fff;color:#7C4412;margin:6px 0}
button.main{background:#7C4412;color:#fff;width:100%}.nums button{min-width:52px;margin:3px}.nums button.on{background:#7C4412;color:#fff}
input{width:100%;box-sizing:border-box;padding:10px;font-size:16px;border:1px solid #c9b8a6;border-radius:8px;margin:4px 0 8px}
#give{display:none;text-align:left}.ok{color:#2c6e2f;font-weight:bold}.err{color:#a12a2a;font-weight:bold}.clock{font-size:13px;color:#5a4636;margin-top:8px}
.spin{width:44px;height:44px;margin:18px auto 12px;border:5px solid #e3d6c6;border-top-color:#7C4412;border-radius:50%;animation:sp 0.9s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
</style></head><body><div class="card" id="c"><div class="spin"></div><p class="small">お買物券を読み込んでいます…</p></div>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
// 2026-11-14：券の画面を小判鮫のサイトに置く（Google ドライブを経由しない）。データは券の仕組み（GAS）から読む。
var API = 'https://script.google.com/macros/s/AKfycbyjz5lJlJvoeA-1rPvK4HUh02RRG4bw0qT1wHRzc5nhv37Xl0weBoEnPjfmPpHLaPgh/exec';
var Q = new URLSearchParams(location.search);
var P = { t: Q.get('t') || '', k: Q.get('k') || '', url: API }; var D = null, pick = 0;
function api(params, ok, ng){ var u = API + '?' + new URLSearchParams(params).toString();
  fetch(u, { credentials: 'omit' }).then(function(r){ return r.json(); }).then(function(j){ if(j && j.error){ (ng||function(){})(new Error(j.error)); } else ok(j); }).catch(function(e){ (ng||function(){})(e); }); }
function $(i){return document.getElementById(i);}
function esc(s){return String(s).replace(/[&<>"]/g,function(x){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[x];});}
function load(){ if(!P.t||!P.k){ draw({ok:false}); return; } api({api:'ticket',t:P.t,k:P.k}, draw, function(){ if(!D) $('c').innerHTML='<p>読み込めませんでした。電波のよい所で、もう一度開いてください。</p>'; }); }
function draw(d){
  if(!d.ok){ $('c').innerHTML='<p class="kicker">小判鮫</p><h1>わらしべ長者</h1><p>この券は見つかりませんでした。メールのリンクをもう一度お確かめください。</p>'; return; }
  var first = !D; D = d; if(!first && $('give').style.display==='block') return;
  var ng = d.state==='有効' ? '' : '<p class="ng">この券は「'+esc(d.state)+'」です</p>';
  var _n=new Date(); var today=_n.getFullYear()+'-'+('0'+(_n.getMonth()+1)).slice(-2)+'-'+('0'+_n.getDate()).slice(-2); if(d.state==='有効' && today < d.from) ng = '<p class="ng">'+d.from+' から使えます</p>';
  var hist = d.uses.length||d.gives.length ? '<div class="hist"><b>使った記録</b><br>'+d.uses.map(function(u){return u.at+'　'+u.used+'枚使用（残り'+u.left+'枚）';}).join('<br>')+(d.gives.length?'<br>'+d.gives.map(function(g){return g.at+'　'+g.n+'枚を譲った';}).join('<br>'):'')+'</div>' : '';
  $('c').innerHTML='<p class="kicker">川越古民家古着屋 小判鮫</p><h1>わらしべ長者</h1><p class="small">お買物券'+(d.origin?'（'+esc(d.origin)+' から譲られた券）':'')+'</p>'+
    '<p class="name">'+esc(d.name)+' 様</p>'+ng+'<p class="left">'+d.left+'<span class="unit"> 枚</span></p><p class="yen">残り '+(d.left*1000).toLocaleString()+'円分（はじめ '+d.issued+'枚）</p>'+
    '<div class="id">'+esc(d.id)+'</div><div id="qr"></div><p class="small">お会計のときに、この画面をスタッフにお見せください（QRを読みます）</p>'+
    '<p class="clock" id="clk"></p>'+hist+
    '<ul class="rules"><li>使える日：<b>'+d.from+'</b> から <b>'+d.until+'</b> まで</li><li>小判鮫の店頭でだけ使えます</li><li>お会計3,000円ごとに1枚（1枚＝1,000円分）</li><li>現金への交換・おつり・再発行はできません</li></ul>'+
    (d.left>0 && d.state==='有効' ? '<button onclick="openGive()">券を譲る</button>' : '')+
    '<div id="give"></div>';
  var q = qrcode(0,'M'); q.addData(location.origin+'/ticket/staff/?t='+encodeURIComponent(d.id));  // 2026-11-14 スタッフ画面もサイトに置いた（Google ドライブに飛ばされないように） q.make(); $('qr').innerHTML = q.createImgTag(6,8);
  tick();
}
// 2026-11-14 龍さん：「いまの時刻」ではなく「使える期限までのカウントダウン」を出す（期限の日の 23:59:59 まで・日本時間）
function tick(){ var e=$('clk'); if(!e || !D || !D.until) return;
  var end = new Date(String(D.until).slice(0,10)+'T23:59:59+09:00').getTime(), s = Math.floor((end - Date.now())/1000);
  if (isNaN(s)) { e.textContent=''; return; }
  if (s < 0) { e.textContent='使える期限を過ぎました'; return; }
  var dd=Math.floor(s/86400), hh=Math.floor(s%86400/3600), mm=Math.floor(s%3600/60), ss=s%60, p=function(n){return (n<10?'0':'')+n;};
  e.textContent='使える期限まで あと '+dd+'日 '+p(hh)+'時間 '+p(mm)+'分 '+p(ss)+'秒'; }
setInterval(tick,1000); setInterval(load,15000);
function openGive(){ pick=0; var b=''; for(var i=1;i<=Math.min(D.left,30);i++) b+='<button onclick="sel('+i+',this)">'+i+'</button>';
  var g=$('give'); g.style.display='block'; g.innerHTML='<hr><p><b>券を譲る</b>：譲る枚数を選んでください（残り'+D.left+'枚）</p><div class="nums">'+b+'</div>'+
  (D.left>30?'<input id="gnum" type="number" inputmode="numeric" placeholder="31枚以上はここに数字で" oninput="pick=+this.value">':'')+
  '<p>譲る相手のメールアドレス（なければ空のまま→あとでリンクを渡せます）</p><input id="gmail" type="email" placeholder="例 friend@example.com"><input id="gname" placeholder="相手のお名前（任意）">'+
  '<button class="main" onclick="give()">譲る</button><button onclick="closeGive()">やめる</button><p id="gmsg"></p>'; }
function sel(n,el){ pick=n; Array.prototype.forEach.call(document.querySelectorAll('.nums button'),function(x){x.classList.toggle('on',x===el);}); }
function closeGive(){ $('give').style.display='none'; load(); }
function give(){ if(!pick){$('gmsg').innerHTML='<span class="err">枚数を選んでください</span>';return;}
  var m=$('gmail').value.trim(); if(!confirm(pick+' 枚を譲ります。あなたの券は残り '+(D.left-pick)+' 枚になります。よいですか？'))return;
  $('gmsg').textContent='…'; api({api:'give',t:P.t,k:P.k,n:pick,to:m,name:$('gname').value}, function(r){
    var share = r.mailed ? '<p class="ok">相手の方にメールで券を送りました（'+esc(r.newId)+'）。</p>' :
      '<p class="ok">譲る券ができました（'+esc(r.newId)+'）。このリンクを相手の方に送ってください。</p><input value="'+esc(r.url)+'" readonly onclick="this.select()"><button onclick="shareUrl(\''+r.url+'\')">リンクを送る（LINEなど）</button>';
    $('give').innerHTML='<hr>'+share+'<button onclick="closeGive()">券の画面に戻る</button>';
  }, function(e){$('gmsg').innerHTML='<span class="err">'+esc(e.message||e)+'</span>';}); }
function shareUrl(u){ if(navigator.share) navigator.share({title:'小判鮫 お買物券',url:u}); else { navigator.clipboard.writeText(u); alert('コピーしました'); } }
load();
</script></body></html>
