name: mannequin-sample
# 写真v2の通し試験。ブランチ mannequin-sample に push した時だけ動く（main は変えない）。
on:
  push:
    branches: [mannequin-sample]
permissions:
  contents: write
concurrency:
  group: mannequin-sample
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # 2026-10-08：ジャンルが空の新商品だけ、1枚目の写真からジャンルを判定して products.json に書く（鍵が無ければ何もしない）
      - name: Genre from photo
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 tools/classify_genre.py
      # 2026-10-09：新しい商品（PHOTO_V2_FROM 以降に公開）の写真の背景と大きさを揃え、マネキン着用イメージ（確認待ち）を作る。
      #   対象0件なら重い道具は入れない。AI代は data/ai_cost/photo_v2.csv に記録し、1枚15円超・月1,000円に届いたら data/ai_cost/STOP を作って止める（最後の段が失敗→メール）。
      - name: Photo v2 check
        id: pv2
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PHOTO_V2_FROM: '2026-10-04'
          PHOTO_V2_ONLY: 'K11190'
        run: python3 tools/photo_v2.py --check
      - name: Install photo tools
        if: steps.pv2.outputs.count != '0'
        continue-on-error: true   # 道具が入らなくても、サイトの作り直し（SOLDの反映）は止めない
        timeout-minutes: 8
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
          pip install -q "rembg[cpu]==2.0.85"   # 版を固定（2026-10-09 に試験した版。勝手に新しい版にならない）
      - name: Cache cutout models
        if: steps.pv2.outputs.count != '0'
        uses: actions/cache@v4
        with:
          path: |
            ~/.u2net
            ~/.rembg
          key: rembg-models-v1
      - name: Photo v2
        continue-on-error: true   # 写真の処理が失敗しても、サイトの作り直し（SOLDの反映）は止めない
        timeout-minutes: 15
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PHOTO_V2_FROM: '2026-10-04'
          PHOTO_V2_ONLY: 'K11190'
        run: python3 tools/photo_v2.py
      - name: Build pages
        run: python3 tools/build_site.py
      - name: Commit generated pages (only if something changed)
        run: |
          git config user.name "kobanzame-site-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "写真v2 通し試験"
            git push origin HEAD:mannequin-sample
          fi
      - name: Alert if AI spending stopped
        if: always()
        run: |
          if [ -f data/ai_cost/STOP ]; then
            echo "::error::写真v2のAI代が上限を超えたので止まっています：$(head -1 data/ai_cost/STOP)"
            exit 1
          fi
