name: mannequin-sample
# マネキン着用イメージの見本づくり（お試し）。ブランチ mannequin-sample に push した時だけ動く。
# サイト・products.json は変えない。できた画像はこのブランチの out/mannequin/ に保存（main には入れない）。
on:
  push:
    branches: [mannequin-sample]
permissions:
  contents: write   # できた見本画像を、このブランチ（mannequin-sample）にだけ保存する。main には書かない
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Make mannequin samples
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python tools/mannequin_sample.py
      - name: Save samples to this branch only
        run: |
          git config user.name "kobanzame-site-bot"
          git config user.email "actions@users.noreply.github.com"
          git add out/mannequin
          git commit -m "マネキン見本 $(date +%F)" || echo "変更なし"
          git push origin HEAD:mannequin-sample
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mannequin-sample
          path: out/mannequin/
          retention-days: 14
