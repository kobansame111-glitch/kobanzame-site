name: mannequin-sample
# 新しい商品写真の見た目を揃える処理（photo_v2）のお試し。ブランチ mannequin-sample に push した時だけ動く。
# サイト・products.json は変えない。できた画像はこのブランチの out/photo_v2/ に保存（main には入れない）。
on:
  push:
    branches: [mannequin-sample]
permissions:
  contents: write   # このブランチにだけ保存する
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
          pip install -q "rembg[cpu]" scipy numpy pillow
      - name: Make photo_v2 samples
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SAMPLE_SKUS: K11263
          SKIP_MANNEQUIN: '1'
        run: python tools/photo_v2.py
      - name: Save samples to this branch only
        run: |
          git config user.name "kobanzame-site-bot"
          git config user.email "actions@users.noreply.github.com"
          git add out/photo_v2
          git commit -m "photo_v2 見本 $(date +%F)" || echo "変更なし"
          git push origin HEAD:mannequin-sample
