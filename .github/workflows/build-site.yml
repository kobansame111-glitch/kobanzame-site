# 小判鮫 公式サイト 自動再生成
# data/products.json（商品データ）か生成スクリプトが変わったら、サイトのHTMLを作り直してコミットする。
# 在庫見張りGAS（60_stock_watch_v1.gs）が売れた商品の status を "sold" に書き換える → ここが動いて SOLD 表示になる。
# このワークフロー自身のコミットは GITHUB_TOKEN で行うため、再度このワークフローを起動しない（無限ループしない）。
name: build-site

on:
  push:
    branches: [main]
    paths:
      - 'data/products.json'
      - 'tools/build_site.py'
  workflow_dispatch:
  # 2026-10-08：11月1日から毎日営業に切り替わるので、その日の0:05と3:05（日本時間）に作り直す
  # （GitHubの時刻はUTC。10/31 15:05 UTC＝11/1 0:05 JST。毎年この日に動くが、変化が無ければ何もコミットしない）
  schedule:
    - cron: '5 15 31 10 *'
    - cron: '5 18 31 10 *'

permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # 2026-10-08：ジャンルが空の新商品だけ、1枚目の写真からジャンルを判定して products.json に書く（鍵が無ければ何もしない）
      - name: Genre from photo
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 tools/classify_genre.py
      # 2026-10-09：新しい商品（PHOTO_V2_FROM 以降に公開）の写真の背景と大きさを揃え、マネキン着用イメージ（確認待ち）を作る。
      #   対象0件なら重い道具は入れない。AI代は data/ai_cost/photo_v2.csv に記録し、1枚15円超・月1,000円に届いたら data/ai_cost/STOP を作って止める（最後の段が失敗→メール）。
      - name: Photo v2 check
        id: pv2
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 tools/photo_v2.py --check
      - name: Install photo tools
        if: steps.pv2.outputs.count != '0'
        continue-on-error: true   # 道具が入らなくても、サイトの作り直し（SOLDの反映）は止めない
        timeout-minutes: 8
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
          pip install -q "rembg[cpu]==2.0.85"   # 版を固定（2026-10-09 に試験した版。勝手に新しい版にならない）
      - name: Cache cutout models
        if: steps.pv2.outputs.count != '0'
        uses: actions/cache@v4
        with:
          path: |
            ~/.u2net
            ~/.rembg
          key: rembg-models-v1
      - name: Photo v2
        continue-on-error: true   # 写真の処理が失敗しても、サイトの作り直し（SOLDの反映）は止めない
        timeout-minutes: 15
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 tools/photo_v2.py
      - name: Build pages
        run: python3 tools/build_site.py
      - name: Commit generated pages (only if something changed)
        run: |
          git config user.name "kobanzame-site-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "サイト自動再生成（data/products.json の変更を反映）"
            git pull --rebase origin main
            git push
          fi
      - name: Alert if AI spending stopped
        if: always()
        run: |
          if [ -f data/ai_cost/STOP ]; then
            echo "::error::写真v2のAI代が上限を超えたので止まっています：$(head -1 data/ai_cost/STOP)"
            exit 1
          fi
